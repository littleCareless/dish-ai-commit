# .github/workflows/release.yml

# ----------------------------------------------------------------
# 自动化发布工作流 (Automated Release Workflow) - v2 (整合版)
# ----------------------------------------------------------------
# 触发时机: 当一个格式为 vX.Y.Z 的新标签被推送到 main 或 develop 分支时。
#
# 核心功能:
# 1. 基于 Git 标签触发，区分预发布 (develop) 和正式发布 (main)。
# 2. 运行代码质量检查 (Lint) 和自动化测试。
# 3. 基于 Conventional Commits 自动生成更新日志 (Changelog)。
# 4. 创建包含更新日志和构建产物的 GitHub Release。
# 5. 将扩展发布到 Open VSX Registry 和 Visual Studio Marketplace。
# 6. 发送发布成功通知到 Slack。
# ----------------------------------------------------------------

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "是否执行真实发布（默认仅打包与验证）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run_publish:
        description: "手动触发时是否对发布步骤做 dry-run（仅在未真实发布时生效）"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  release:
    name: Create and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.24.0

      - name: Clean up local tags
        run: |
          git tag -d $(git tag -l) 2>/dev/null || true
          git fetch --tags

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify dependencies for esbuild
        run: |
          echo "Verifying critical dependencies for esbuild..."
          # 检查根目录 node_modules（pnpm workspace 可能在根目录 hoist）
          if [ -d "node_modules/ignore" ] || [ -d "src/node_modules/ignore" ]; then
            echo "✓ 'ignore' package found"
          else
            echo "::warning::'ignore' package not found in expected locations, but pnpm may resolve via .pnpm store"
          fi
          if [ -d "node_modules/fast-deep-equal" ] || [ -d "src/node_modules/fast-deep-equal" ]; then
            echo "✓ 'fast-deep-equal' package found"
          else
            echo "::warning::'fast-deep-equal' package not found in expected locations, but pnpm may resolve via .pnpm store"
          fi
          # 验证包在 package.json 中声明
          if grep -q '"ignore"' src/package.json && grep -q '"fast-deep-equal"' src/package.json; then
            echo "✓ Dependencies declared in src/package.json"
          else
            echo "::error::Dependencies not properly declared in src/package.json"
            exit 1
          fi

      - name: Compute publish flags
        id: flags
        run: |
          IS_TAG=false
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_TAG=true
          fi

          INPUT_PUBLISH="${{ github.event.inputs.publish || 'false' }}"
          INPUT_DRYRUN="${{ github.event.inputs.dry_run_publish || 'true' }}"

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            INPUT_PUBLISH="false"
            INPUT_DRYRUN="true"
          fi

          DO_PUBLISH=false
          DO_DRYRUN=false

          if [[ "$IS_TAG" == "true" ]]; then
            DO_PUBLISH=true
          elif [[ "$INPUT_PUBLISH" == "true" ]]; then
            DO_PUBLISH=true
          fi

          if [[ "$DO_PUBLISH" != "true" && "$INPUT_DRYRUN" == "true" ]]; then
            DO_DRYRUN=true
          fi

          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "do_publish=$DO_PUBLISH" >> $GITHUB_OUTPUT
          echo "do_dry_run=$DO_DRYRUN" >> $GITHUB_OUTPUT

      # =================================================================
      # 1. 代码质量保证 (Code Quality Assurance)
      # =================================================================
      - name: Lint code
        run: pnpm lint

      # =================================================================
      # Determine Release Type (Moved before build to pass flags)
      # =================================================================
      - name: Determine if pre-release
        id: determine_prerelease
        if: steps.flags.outputs.do_publish == 'true'
        run: |
          # 安全地获取远程信息，避免标签冲突
          git fetch origin --prune --prune-tags
          git fetch origin +refs/heads/*:refs/remotes/origin/* --force

          # 获取当前标签对应的提交哈希
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          echo "Tag ${{ github.ref }} points to commit: $TAG_COMMIT"

          # 检查该提交在哪些分支上
          BRANCHES=$(git branch -r --contains $TAG_COMMIT | grep -v 'HEAD' | sed 's/origin\///' | tr -d ' ')
          echo "Commit is on branches: $BRANCHES"

          # 获取主要分支（优先级：main > master > release/* > develop）
          MAIN_BRANCH=""
          for branch in $BRANCHES; do
            case $branch in
              main)
                MAIN_BRANCH="main"
                break
                ;;
              master)
                if [[ -z "$MAIN_BRANCH" ]]; then
                  MAIN_BRANCH="master"
                fi
                ;;
              release/*)
                if [[ -z "$MAIN_BRANCH" ]] || [[ "$MAIN_BRANCH" != "main" && "$MAIN_BRANCH" != "master" ]]; then
                  MAIN_BRANCH="$branch"
                fi
                ;;
              develop)
                if [[ -z "$MAIN_BRANCH" ]] || [[ "$MAIN_BRANCH" == "develop" ]]; then
                  MAIN_BRANCH="develop"
                fi
                ;;
            esac
          done

          echo "Primary branch for this tag: $MAIN_BRANCH"

          # 判断是否为预发布
          case $MAIN_BRANCH in
            main|master|release/*)
              echo "is_prerelease=false" >> $GITHUB_OUTPUT
              echo "This is a stable release from branch: $MAIN_BRANCH"
              ;;
            *)
              echo "is_prerelease=true" >> $GITHUB_OUTPUT
              echo "This is a pre-release from branch: $MAIN_BRANCH"
              ;;
          esac

      - name: Build and Package (turbo)
        id: package
        env:
          TURBO_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p release-artifacts
          pnpm turbo run package --filter dish-ai-commit -- ${{ steps.determine_prerelease.outputs.is_prerelease == 'true' && '--pre-release' || '' }}

          VSIX_FILE=$(ls src/*.vsix | head -n 1 || true)

          # Verify VSIX existence (Fail-fast)
          if [ -z "$VSIX_FILE" ] || [ ! -f "$VSIX_FILE" ]; then
            echo "::error::VSIX file not found under src/"
            exit 1
          fi

          # Move VSIX to a known location
          mv "$VSIX_FILE" release-artifacts/extension.vsix

          echo "Found VSIX: release-artifacts/extension.vsix"
          echo "vsix_path=release-artifacts/extension.vsix" >> $GITHUB_OUTPUT

      - name: Dry-run publish (vsce/ovsx)
        if: steps.flags.outputs.do_dry_run == 'true'
        env:
          VSIX_FILE: ${{ steps.package.outputs.vsix_path }}
        run: |
          echo "Dry-run vsce publish..."
          echo "Dry-run vsce publish... (Skipped: @vscode/vsce does not support --dry-run)"
          # pnpm dlx @vscode/vsce publish --packagePath "$VSIX_FILE" --pre-release --dry-run
          echo "Dry-run ovsx publish... (Skipped: ovsx does not support --dry-run)"
          # pnpm dlx ovsx publish "$VSIX_FILE" --pre-release --skip-duplicate --pat "${OVSX_PAT:-dummy}" --dry-run 2>/dev/null || echo "ovsx dry-run skipped"



      # =================================================================
      # 3. 获取更新日志 (Generate Changelog)
      # =================================================================
      - name: Extract latest changelog section (中文)
        id: extract_changelog
        run: |
          body=$(awk '
            BEGIN { capture=0 }
            /^# [0-9]+\.[0-9]+\.[0-9]+ \(/ {
              if (capture) exit;
              capture=1;
            }
            capture { print }
          ' CHANGELOG.zh-CN.md)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # =================================================================
      # 4. 发布到市场 (Publish to Marketplaces)
      # =================================================================
      - name: Publish to Open VSX Registry
        uses: HaaLeo/publish-vscode-extension@v2
        id: publishToOpenVSX
        if: steps.flags.outputs.do_publish == 'true'
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.package.outputs.vsix_path }}
          preRelease: ${{ steps.determine_prerelease.outputs.is_prerelease }}
          skipDuplicate: true

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v2
        id: publishToVSMarketplace
        if: steps.flags.outputs.do_publish == 'true'
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.package.outputs.vsix_path }}
          preRelease: ${{ steps.determine_prerelease.outputs.is_prerelease }}
          skipDuplicate: true

      # =================================================================
      # 5. 创建 GitHub Release (Create GitHub Release)
      # =================================================================
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: steps.flags.outputs.do_publish == 'true'
        with:
          body: ${{ steps.extract_changelog.outputs.body }}
          files: |
            ${{ steps.package.outputs.vsix_path }}
          prerelease: ${{ steps.determine_prerelease.outputs.is_prerelease }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
